<!DOCTYPE html>
<html>
<head>
    <title>Town Economy Game - Mayor Cat</title>
    <style>
        body { 
            font-family: 'Arial', sans-serif; 
            padding: 20px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            color: #333;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        h1 { 
            color: #4a5568; 
            text-align: center;
            margin-bottom: 30px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            background: #edf2f7;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #2d3748;
        }
        .mayor-display {
            text-align: center;
            margin: 30px 0;
            padding: 20px;
            background: #f7fafc;
            border-radius: 15px;
        }
        .mayor-icon {
            font-size: 4em;
            display: block;
            margin-bottom: 10px;
        }
        .message-box {
            background: white;
            border: 2px solid #cbd5e0;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            min-height: 150px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-size: 18px;
            line-height: 1.6;
        }
        .options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 20px 0;
            justify-content: center;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            min-width: 200px;
            margin: 5px;
        }
        .btn-primary {
            background: #48bb78;
            color: white;
        }
        .btn-primary:hover {
            background: #38a169;
        }
        .btn-secondary {
            background: #4299e1;
            color: white;
        }
        .btn-secondary:hover {
            background: #3182ce;
        }
        .btn-danger {
            background: #f56565;
            color: white;
        }
        .btn-danger:hover {
            background: #e53e3e;
        }
        .phase-indicator {
            background: #4c51bf;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .audio-controls {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }
        .ending {
            text-align: center;
            padding: 40px;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            border-radius: 20px;
            margin-top: 30px;
            display: none;
        }
        .trophy {
            font-size: 5em;
            margin: 20px;
        }
        .welcome-message {
            text-align: center;
            font-size: 1.2em;
            color: #4a5568;
            margin-bottom: 30px;
            padding: 15px;
            background: #e6fffa;
            border-radius: 10px;
            border-left: 5px solid #38b2ac;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏛️ Town Economy Game </h1>
        
        <div class="welcome-message">
            Welcome to PennyVille Town!  Make decisions to keep the town happy and manage the budget.
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <div>💰 Budget</div>
                <div class="stat-value" id="budget">1000</div>
            </div>
            <div class="stat-item">
                <div>😊 Happiness</div>
                <div class="stat-value" id="happiness">50</div>
            </div>
            <div class="stat-item">
                <div>📅 Day</div>
                <div class="stat-value" id="day">0</div>
            </div>
        </div>
        
        
        <div class="message-box" id="message">
            Loading initial message...
        </div>
        
        <div class="options" id="options"></div>
        
        <div class="audio-controls">
            <button class="btn btn-secondary" onclick="speakCurrentMessage()">🔊 Speak Message</button>
            <button class="btn btn-secondary" onclick="nextPhase()">⏭️ Next Phase</button>
            <button class="btn btn-danger" onclick="resetGame()">🔄 Reset Game</button>
        </div>
        
        <div class="ending" id="ending">
            <h2>Game Complete!</h2>
            <div class="trophy" id="trophy">🏆</div>
            <div id="ending-message"></div>
            <button class="btn btn-primary" onclick="resetGame()">Play Again</button>
        </div>
    </div>
    
    <script>
        let currentPhase = 'introduction';
        let currentMessage = '';
        
        // Initialize game
        async function initGame() {
            await updateGameState();
            await loadScenario(currentPhase);
        }
        
        // Load a scenario
        async function loadScenario(phase) {
            try {
                console.log('Loading scenario for phase:', phase);
                const url = `/api/gemini/scenario?phase=${phase}`;
                const response = await fetch(url);
                const data = await response.json();
                
                console.log('Response from server:', data);
                
                currentPhase = data.phase;
                currentMessage = data.response;
                
                // Update UI
                let phaseDisplay = currentPhase.charAt(0).toUpperCase() + currentPhase.slice(1);
                if (currentPhase === 'day1') phaseDisplay = 'Day 1: Pizza Party';
                if (currentPhase === 'day2') phaseDisplay = 'Day 2: Broken Window';
                if (currentPhase === 'day3') phaseDisplay = 'Day 3: Tough Choice';
                if (currentPhase === 'final') phaseDisplay = 'Final Day: Celebration';
                
                // Show phase in message box for debugging
                document.getElementById('message').innerHTML = 
                    `<strong>Phase: ${phaseDisplay}</strong><br><br>${currentMessage}`;
                
                // Show options
                const optionsDiv = document.getElementById('options');
                if (data.options && data.options.length > 0) {
                    console.log('Options available:', data.options);
                    optionsDiv.innerHTML = data.options.map(option => 
                        `<button class="btn btn-primary" onclick="makeDecision('${option.id}', '${currentPhase}')">
                            ${option.label}<br>
                            <small>💰 $${option.cost} | 😊 ${option.happiness > 0 ? '+' : ''}${option.happiness}</small>
                        </button>`
                    ).join('');
                } else {
                    optionsDiv.innerHTML = '<p style="text-align: center; width: 100%; color: #718096;">No options available for this phase.</p>';
                }
                
                // Auto-speak message
                setTimeout(() => speakCurrentMessage(), 500);
                
            } catch (error) {
                console.error('Error loading scenario:', error);
                document.getElementById('message').innerHTML = 
                    'Error loading scenario. Check console for details.';
            }
        }
        
        // Speak the current message
        async function speakCurrentMessage() {
            try {
                const response = await fetch('/api/speak', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({text: currentMessage})
                });
                
                const data = await response.json();
                
                if (data.audio_url) {
                    const audio = new Audio(data.audio_url);
                    audio.play().catch(e => console.log('Auto-play prevented:', e));
                }
            } catch (error) {
                console.error('Error with speech:', error);
            }
        }
        
        // Make a decision
        async function makeDecision(decisionId, phase) {
            console.log('Making decision:', decisionId, 'for phase:', phase);
            try {
                const response = await fetch('/api/game/decision', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        id: decisionId,
                        phase: phase
                    })
                });
                
                const result = await response.json();
                console.log('Decision result:', result);
                
                // Update local state
                await updateGameState();
                
                // Load next phase
                await loadScenario(result.state.game_phase);
                
            } catch (error) {
                console.error('Error making decision:', error);
                alert('Error making decision: ' + error.message);
            }
        }
        
        // Show ending
        function showEnding(endingType) {
            console.log('Showing ending:', endingType);
            const endingMessages = {
                "Super Star Mayor!": "🎉 SUPER STAR MAYOR! You managed both budget and happiness perfectly! You're the best mayor ever! 🏆",
                "Most Loved Mayor!": "❤️ MOST LOVED MAYOR! While short on funds, your compassion made you the most loved Mayor!",
                "Money Smart Mayor!": "💰 MONEY SMART MAYOR! You saved money but could have made the town happier.",
                "Good Try Mayor!": "👍 GOOD TRY MAYOR! You did your best! With more practice, you'll be a great mayor!"
            };
            
            const trophies = {
                "Super Star Mayor!": "🏆✨",
                "Most Loved Mayor!": "❤️🏆",
                "Money Smart Mayor!": "💰🏆",
                "Good Try Mayor!": "👍🏆"
            };
            
            document.getElementById('ending-message').innerHTML = 
                endingMessages[endingType] || "Game complete! Thank you for playing!";
            document.getElementById('trophy').textContent = 
                trophies[endingType] || "🏆";
            document.getElementById('ending').style.display = 'block';
            document.querySelector('.container').scrollIntoView({behavior: 'smooth'});
        }
        
        // Next phase - MANUALLY cycle through phases
        async function nextPhase() {
            console.log('Manual next phase clicked');
            const phases = ['introduction', 'day1', 'day2', 'day3', 'final'];
            const currentIndex = phases.indexOf(currentPhase);
            
            if (currentIndex < phases.length - 1) {
                await loadScenario(phases[currentIndex + 1]);
            } else {
                // If we're at the end, check if we should show ending
                const stateResponse = await fetch('/api/game/state');
                const state = await stateResponse.json();
                
                if (state.game_phase === 'completed' && state.ending) {
                    showEnding(state.ending);
                } else {
                    await loadScenario('final');
                }
            }
        }
        
        // Reset game
        async function resetGame() {
            if (confirm('Reset the game to start over?')) {
                try {
                    await fetch('/api/game/reset', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'}
                    });
                    
                    // Hide ending
                    document.getElementById('ending').style.display = 'none';
                    
                    // Reload game
                    await initGame();
                    
                } catch (error) {
                    console.error('Error resetting game:', error);
                    location.reload();
                }
            }
        }
        
        // Update game state display
        async function updateGameState() {
            try {
                const response = await fetch('/api/game/state');
                const state = await response.json();
                console.log('Game state:', state);
                
                document.getElementById('budget').textContent = state.budget;
                document.getElementById('happiness').textContent = state.happiness;
                document.getElementById('day').textContent = state.day;
                
                // Update game phase if needed
                if (state.game_phase !== currentPhase) {
                    console.log('Phase changed from', currentPhase, 'to', state.game_phase);
                    currentPhase = state.game_phase;
                }
                
                // Check if game is completed
                if (state.game_phase === 'completed' && state.ending) {
                    showEnding(state.ending);
                }
                
            } catch (error) {
                console.error('Error updating game state:', error);
            }
        }
        
        // Initialize game when page loads
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Game initializing...');
            initGame();
        });
    </script>
</body>
</html>
