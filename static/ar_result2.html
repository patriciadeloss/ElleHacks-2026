<!DOCTYPE html>
<html>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<!-- we import arjs version without NFT but with marker + location based support -->
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<body style="margin : 0px; overflow: hidden;">
    <a-scene embedded arjs>
        <a-marker preset="hiro">
            <a-entity position="0 0 1" scale="10 10 10" rotation="-90 0 0" gltf-model="coin.glb"></a-entity>
            <a-entity position="0 1 1.8" scale="3 3 3" rotation="-90 0 0"
                text="value: You saved money, great job! Next time, try making the townspeople happy too. Try again!; color: #FFFFFF; align: center; width: 2"></a-entity>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>
</body>

</html>
