<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-image: url('/static/img/result2.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            background-color: #f5f5f5;
            display: grid;
            align-items: center;
            justify-content: center;
        }

        .btn {
            display: grid;
            background: #6acc59;
            color: white;
            height: 8vh;
            width: 20vw;
            border-radius: 16px;
            border: #f5f5f5 5px solid;
            box-shadow: #666 2px 2px 10px;
            align-items: center;
            transform: translateY(35vh);
            white-space: normal;
            text-decoration: none;
            font-weight: bold;
            text-align: center;
            font-size: 2.5rem;
            font-family: DynaPuff;
        }

        .btn:hover {
            background: #47903a;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <a class="btn" href="/static/ar_result3.html">View AR Result</a>
</body>

</html>
