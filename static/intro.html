<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&display=swap" rel="stylesheet">
    <title>Intro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: grid;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;

            background-image: url('/static/img/qr.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
        }

        .title {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 24px;
        }

        .btn {
            display: grid;
            background: #6acc59;
            color: white;
            height: 8vh;
            width: 20vw;
            border-radius: 16px;
            border: #f5f5f5 5px solid;
            box-shadow: #666 2px 2px 10px;
            align-items: center;
            transform: translateY(35vh);
            white-space: normal;

            text-decoration: none;
            font-weight: bold;
            text-align: center;
            font-size: 2.5rem;
            font-family: DynaPuff;
        }

        .btn:hover {
            background: #47903a;
            cursor: pointer;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .loading-overlay.active {
            display: flex;
        }

        .spinner {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #6acc59;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: white;
            font-size: 1.5em;
            margin-top: 20px;
            font-family: DynaPuff;
        }
    </style>
</head>

<body>
    <button class="btn" onclick="startGame()">Let's Begin</button>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">🏛️ Loading town scenarios...</div>
    </div>

    <script>
        async function startGame() {
            // Show loading overlay
            document.getElementById('loadingOverlay').classList.add('active');

            try {
                // Trigger AI to generate scenarios
                const response = await fetch('/api/scenarios');
                const data = await response.json();

                if (data.scenarios) {
                    // Store scenarios in sessionStorage to pass to scenario.html
                    sessionStorage.setItem('gameScenarios', JSON.stringify(data.scenarios));
                    // Navigate to game page
                    window.location.href = '/static/scenario.html';
                } else {
                    alert('Error generating scenarios. Please try again.');
                    document.getElementById('loadingOverlay').classList.remove('active');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error connecting to server. Please try again.');
                document.getElementById('loadingOverlay').classList.remove('active');
            }
        }
    </script>
</body>

</html>
