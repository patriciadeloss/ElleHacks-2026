<!DOCTYPE html>
<html>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<!-- we import arjs version without NFT but with marker + location based support -->
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<body style="margin : 0px; overflow: hidden;">
    <a-scene embedded arjs>
        <a-marker preset="hiro">
            <a-entity position="0 0 1" scale="1 1 1" rotation="0 -90 90" gltf-model="smile.glb"></a-entity>
            <a-entity position="0 1 1.8" scale="3 3 3" rotation="-90 0 0"
                text="value: The town loved your choices! Next time, save a bit more so the museum can be built. Give it another try!; color: #FFFFFF; align: center; width: 2"></a-entity>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>
</body>

</html>
