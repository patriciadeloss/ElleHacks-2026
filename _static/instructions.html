<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&display=swap" rel="stylesheet">
    <title>Instructions</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: grid;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            transition: background-image 0.5s ease-in-out;
        }

        .btn {
            display: grid;
            background: #6acc59;
            color: white;
            height: 8vh;
            width: 20vw;
            border-radius: 16px;
            border: #f5f5f5 5px solid;
            box-shadow: #666 2px 2px 10px;
            align-items: center;
            transform: translateY(35vh);
            white-space: normal;

            text-decoration: none;
            font-weight: bold;
            text-align: center;
            font-size: 2.5rem;
            font-family: DynaPuff;
        }

        .btn:hover {
            background: #47903a;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <button class="btn" id="nextBtn" onclick="nextInstruction()">Next</button>

    <script>
        let currentInstruction = 1;
        const totalInstructions = 2;

        function showInstruction(instructionNum) {
            const body = document.body;
            body.style.backgroundImage = `url('./img/instruction${instructionNum}.png')`;
        }

        function nextInstruction() {
            if (currentInstruction < totalInstructions) {
                currentInstruction++;
                showInstruction(currentInstruction);
            } else {
                // Navigate to intro.html to start the game
                window.location.href = './intro.html';
            }
        }

        // Show first instruction on page load
        window.onload = () => {
            showInstruction(currentInstruction);
        };
    </script>
</body>

</html>
